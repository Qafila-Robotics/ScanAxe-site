name: commit-policy

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  commits:
    # OPS-11 (ScanAxe DEC-P014): vars.CI_RUNNER picks the runner, ubuntu-latest when unset. This repo is
    # public, so pull requests from forks always stay on ubuntu-latest.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check commit messages and PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: sh scripts/check-commit-policy.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" "$PR_TITLE"
