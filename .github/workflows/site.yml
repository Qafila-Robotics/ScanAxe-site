name: site

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # OPS-11 (ScanAxe DEC-P014): vars.CI_RUNNER picks the runner, ubuntu-latest when unset. This repo is
    # public, so pull requests from forks always stay on ubuntu-latest.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.CI_RUNNER || 'ubuntu-latest' }}
    env:
      # Project Pages URL until the custom domain is set (OPS-01); then set the repo variable SITE_BASE_URL to '/'.
      NUXT_APP_BASE_URL: ${{ vars.SITE_BASE_URL || '/ScanAxe-site/' }}
      NUXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL || 'https://qafila-robotics.github.io/ScanAxe-site' }}
      # F-011: the API's waitlist endpoint (e.g. https://api.example.com/api/v1/waitlist). While the repo
      # variable is unset the form shows the "opens soon" note (or the contact email) instead.
      NUXT_PUBLIC_WAITLIST_URL: ${{ vars.WAITLIST_URL || '' }}
      NUXT_PUBLIC_CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Tokens are current
        run: npm run tokens:check
      - name: Lint (ESLint + logical CSS)
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Generate static site
        run: npm run generate
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: .output/public

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    # OPS-11: same runner switch as the build job (fork pull requests never reach this job).
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
